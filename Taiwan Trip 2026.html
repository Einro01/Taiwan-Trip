<style>
/* Layout: one phone-width column. Sticky day tabs, a timeline per day, MRT line colors as transport chips. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --ink: #131c26;
  --muted: #566271;
  --line: #dce2e8;
  --accent: #0a5fa8;
  --accent-soft: #e4eef8;
  --flag-bg: #fcefcc;
  --flag-fg: #6b4800;
  --mrt-blue: #0070bd;
  --mrt-red: #e3002c;
  --mrt-green: #008659;
  --mrt-airport: #8246af;
  --rail: #1f3a68;
  --pingxi: #a8620f;
  --bus: #4b5563;
  --ferry: #0e7480;
  --flight: #334155;
  --chip-fg: #ffffff;
  --f-display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1319; --surface: #161f29; --ink: #e6ecf1; --muted: #9ba8b6; --line: #263240;
    --accent: #62acef; --accent-soft: #15304a; --flag-bg: #3a2e0f; --flag-fg: #f1cb6b;
    --rail: #2c5191; --bus: #5b6676; --flight: #4a5a70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1319; --surface: #161f29; --ink: #e6ecf1; --muted: #9ba8b6; --line: #263240;
  --accent: #62acef; --accent-soft: #15304a; --flag-bg: #3a2e0f; --flag-fg: #f1cb6b;
  --rail: #2c5191; --bus: #5b6676; --flight: #4a5a70;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Hero */
.hero .wrap { padding-block: 28px 18px; display: flex; flex-direction: column; gap: 8px; }
.kicker {
  font-family: var(--f-mono); font-size: 12px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
}
h1 {
  font-family: var(--f-display); font-weight: 800; font-size: 60px;
  line-height: .92; letter-spacing: -.03em; margin: 0;
}
.hero .dates { font-size: 19px; font-weight: 700; margin: 4px 0 0; }
.hero .base { color: var(--muted); margin: 0; font-size: 15px; }
.count {
  align-self: flex-start; margin-top: 6px;
  font-family: var(--f-mono); font-size: 13px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
  padding: 6px 10px; border-radius: 6px;
}

/* Tabs */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.tabs .wrap {
  display: flex; gap: 6px; overflow-x: auto; padding-block: 10px;
  scrollbar-width: none;
}
.tabs .wrap::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 13px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 15px; line-height: 1.15;
}
.tab small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] small { color: var(--bg); opacity: .75; }

/* Panels */
.panel .wrap { padding-block: 22px 56px; display: flex; flex-direction: column; gap: 28px; }
h2 {
  font-family: var(--f-display); font-weight: 800; font-size: 34px;
  line-height: 1.02; letter-spacing: -.02em; margin: 0; text-wrap: balance;
}
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec > h3 {
  margin: 0; font-family: var(--f-mono); font-size: 12px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.dayhead { display: flex; flex-direction: column; gap: 6px; }
.dayhead .when { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.dayhead .route { color: var(--muted); font-size: 15px; margin: 0; }
.checkbox {
  background: var(--accent-soft); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.checkbox b { font-size: 13px; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.checkbox p { margin: 0; font-size: 15.5px; }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before {
  content: ""; position: absolute; left: 65px; top: 14px; bottom: 14px;
  width: 2px; background: var(--line);
}
.step { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; padding-block: 11px; position: relative; }
.step::before {
  content: ""; position: absolute; left: 61px; top: 17px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg);
}
.step.move::before { left: 62px; top: 18px; width: 8px; height: 8px; background: var(--bg); border: 2px solid var(--muted); box-shadow: none; }
.t {
  font-family: var(--f-mono); font-size: 14px; font-weight: 600; line-height: 1.3;
  font-variant-numeric: tabular-nums; padding-top: 1px;
}
.t .end { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.c { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.c h4 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.step.move h4 { font-size: 15.5px; color: var(--muted); }
.step.move .t { color: var(--muted); font-weight: 400; }
.meta { margin: 0; font-size: 14px; color: var(--muted); }
.note { margin: 2px 0 0; font-size: 15px; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip {
  font-size: 12px; font-weight: 700; line-height: 1; color: var(--chip-fg);
  padding: 5px 8px; border-radius: 4px; white-space: nowrap;
}
.chip.BL { background: var(--mrt-blue); } .chip.R { background: var(--mrt-red); }
.chip.G { background: var(--mrt-green); } .chip.A { background: var(--mrt-airport); }
.chip.TRA { background: var(--rail); } .chip.PX { background: var(--pingxi); }
.chip.BUS { background: var(--bus); } .chip.FERRY { background: var(--ferry); }
.chip.FLY { background: var(--flight); }
.flag {
  align-self: flex-start; margin-top: 4px;
  font-family: var(--f-mono); font-size: 11px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  background: var(--flag-bg); color: var(--flag-fg); padding: 3px 7px; border-radius: 4px;
}

/* Overview */
.glance { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.glance button {
  width: 100%; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 2px; background: none; border: 0; border-bottom: 1px solid var(--line);
  text-align: left; cursor: pointer;
}
.glance .d { font-family: var(--f-mono); font-size: 13px; font-weight: 600; line-height: 1.3; }
.glance .d span { display: block; color: var(--muted); font-weight: 400; }
.glance .th { font-size: 16px; font-weight: 700; line-height: 1.3; }
.glance .go { color: var(--accent); font-family: var(--f-mono); font-size: 18px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.card.wide { grid-column: span 2; }
.card .lbl { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card .big { font-size: 20px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.card p { margin: 0; font-size: 14.5px; color: var(--muted); }
.copy {
  align-self: flex-start; margin-top: 6px; cursor: pointer;
  font-size: 14px; font-weight: 700; padding: 7px 12px; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent); border: 0;
}
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.todo label {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
}
.todo input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.todo .when { display: block; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--accent); }
.todo .what { display: block; font-weight: 700; line-height: 1.3; }
.todo .why { display: block; font-size: 14px; color: var(--muted); }
.todo input:checked ~ span .what { text-decoration: line-through; color: var(--muted); }
.facts { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.facts dt { font-weight: 700; font-size: 14.5px; }
.facts dd { margin: 0; font-size: 14.5px; color: var(--muted); }
.open { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.open li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.open b { line-height: 1.3; }
.open span { font-size: 14.5px; color: var(--muted); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
summary { cursor: pointer; font-weight: 700; }
details ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
details a { color: var(--accent); word-break: break-word; }
.foot { font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 360px) { .cards { grid-template-columns: 1fr; } .card.wide { grid-column: auto; } h1 { font-size: 52px; } }
@media (prefers-reduced-motion: no-preference) { .panel:not([hidden]) .wrap { animation: rise .2s ease-out; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
</style>

var ADDRESS = "9F-2, No.36, Xining S. Rd., Wanhua District, Taipei 108";

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) { return null; }
}
function ymd(tz) {
  try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
  catch (e) { return new Date().toISOString().slice(0, 10); }
}
function dayDiff(a, b) {
  var pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
}

function stepHTML(s) {
  var meta = [s.where, s.dur || s.meta].filter(Boolean).map(esc).join(" · ");
  var chips = (s.lines || []).map(function (l) { return '<span class="chip ' + l[0] + '">' + esc(l[1]) + "</span>"; }).join("");
  return '<li class="step' + (s.move ? " move" : "") + '">' +
    '<div class="t">' + esc(s.t) + (s.e ? '<span class="end">' + esc(s.e) + "</span>" : "") + "</div>" +
    '<div class="c"><h4>' + esc(s.title) + "</h4>" +
    (meta ? '<p class="meta">' + meta + "</p>" : "") +
    (chips ? '<div class="chips">' + chips + "</div>" : "") +
    (s.note ? '<p class="note">' + esc(s.note) + "</p>" : "") +
    (s.flag ? '<span class="flag">' + esc(s.flag) + "</span>" : "") +
    "</div></li>";
}

function dayPanel(d) {
  return '<section class="panel" id="p-' + d.id + '" role="tabpanel" aria-labelledby="t-' + d.id + '" hidden><div class="wrap">' +
    '<div class="dayhead"><span class="when">Day ' + d.n + " · " + d.dow + " " + d.date + "</span>" +
    "<h2>" + esc(d.theme) + "</h2>" +
    '<p class="route">Getting around: ' + esc(d.route) + "</p></div>" +
    '<div class="checkbox"><b>Check before you go</b><p>' + esc(d.check) + "</p></div>" +
    '<ol class="tl">' + d.steps.map(stepHTML).join("") + "</ol>" +
    "</div></section>";
}

function overviewPanel() {
  var done = {};
  try { done = JSON.parse(store("tw-todo") || "{}") || {}; } catch (e) { done = {}; }
  return '<section class="panel" id="p-overview" role="tabpanel" aria-labelledby="t-overview" hidden><div class="wrap">' +
    '<div class="sec"><h3>Five days</h3><ul class="glance">' +
    DAYS.map(function (d) {
      return '<li><button type="button" data-go="' + d.id + '"><span class="d">Day ' + d.n + "<span>" + d.dow + " " + d.date + '</span></span><span class="th">' + esc(d.theme) + '</span><span class="go" aria-hidden="true">&#8250;</span></button></li>';
    }).join("") + "</ul></div>" +

    '<div class="sec"><h3>Essentials</h3><div class="cards">' +
    '<div class="card"><span class="lbl">Flight out</span><span class="big">Wed 07:45</span><p>DMK to TPE. Lands 12:30 Taiwan time.</p></div>' +
    '<div class="card"><span class="lbl">Flight home</span><span class="big">Sun 18:35</span><p>TPE to DMK. Lands about 21:30 Bangkok time.</p></div>' +
    '<div class="card wide"><span class="lbl">Hotel</span><span class="big">Wonderwall Ximending</span><p id="addr">' + esc(ADDRESS) + '</p><p>Check-in from 15:00, check-out before 11:00. Nearest MRT: Ximen (Blue and Green lines).</p><button type="button" class="copy" id="copy">Copy address</button></div>' +
    '<div class="card wide"><span class="lbl">Airport MRT Express</span><span class="big">NT$160 · 35 to 39 min</span><p>TPE to Taipei Main (A1), about every 15 min. First train from the airport 06:12, last 22:42.</p></div>' +
    "</div></div>" +

    '<div class="sec"><h3>Before you go</h3><ul class="todo">' +
    TODO.map(function (t) {
      return '<li><label><input type="checkbox" id="todo-' + t.id + '" data-todo="' + t.id + '"' + (done[t.id] ? " checked" : "") + '><span><span class="when">' + esc(t.when) + '</span><span class="what">' + esc(t.what) + '</span><span class="why">' + esc(t.why) + "</span></span></label></li>";
    }).join("") + "</ul></div>" +

    '<div class="sec"><h3>Good to know</h3><dl class="facts">' +
    "<div><dt>Time</dt><dd>Taiwan is UTC+8, 1 h ahead of Thailand. Flight times are local at each airport.</dd></div>" +
    "<div><dt>Daylight</dt><dd>Sunrise about 06:17, sunset about 17:03. Keep outdoor sights before 17:00.</dd></div>" +
    "<div><dt>Closures</dt><dd>All five days are Wed to Sun, so Monday closures do not affect any stop.</dd></div>" +
    "<div><dt>Entry</dt><dd>Visa-free trial for Thai passports extended to 31 Jul 2027. Confirm on the Bureau of Consular Affairs site.</dd></div>" +
    "</dl></div>" +

    '<div class="sec"><h3>Still to decide</h3><ul class="open">' +
    OPEN.map(function (o) { return "<li><b>" + esc(o[0]) + "</b><span>" + esc(o[1]) + "</span></li>"; }).join("") +
    "</ul></div>" +

    '<details><summary>Sources (read 24 Oct 2026)</summary><ul>' +
    SOURCES.map(function (s) { return '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + "</a></li>"; }).join("") +
    "</ul></details>" +
    '<p class="foot">Fares and hours can change. Confirm before you travel.</p>' +
    "</div></section>";
}

var TABS = [{ id: "overview", label: "Overview", small: "Trip" }].concat(DAYS.map(function (d) {
  return { id: d.id, label: "Day " + d.n, small: d.dow + " " + d.date.split(" ")[0] };
}));

function select(id, focus) {
  if (!document.getElementById("p-" + id)) id = "overview";
  TABS.forEach(function (t) {
    var on = t.id === id;
    var b = document.getElementById("t-" + t.id);
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
    document.getElementById("p-" + t.id).hidden = !on;
    if (on) {
      b.scrollIntoView({ block: "nearest", inline: "nearest" });
      if (focus) b.focus();
    }
  });
  store("tw-tab", id);
}

function start() {
  var tabs = document.getElementById("tabs");
  var today = ymd("Asia/Taipei");
  var tripDay = null;
  DAYS.forEach(function (d) { if (d.iso === today) tripDay = d; });

  tabs.innerHTML = TABS.map(function (t) {
    var small = tripDay && tripDay.id === t.id ? "Today" : t.small;
    return '<button type="button" class="tab" role="tab" id="t-' + t.id + '" aria-controls="p-' + t.id + '" aria-selected="false">' + t.label + "<small>" + small + "</small></button>";
  }).join("");
  document.getElementById("panels").innerHTML = overviewPanel() + DAYS.map(dayPanel).join("");

  var left = dayDiff(ymd("Asia/Bangkok"), "2026-11-25");
  var count = document.getElementById("count");
  if (tripDay) count.textContent = "Day " + tripDay.n + " of 5 · today";
  else if (left > 1) count.textContent = left + " days to go";
  else if (left === 1) count.textContent = "Fly tomorrow at 07:45";
  else if (left === 0) count.textContent = "Flying today";
  else count.textContent = "Trip complete";

  tabs.addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (b) select(b.id.slice(2));
  });
  tabs.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var ids = TABS.map(function (t) { return t.id; });
    var cur = ids.indexOf((store("tw-tab") || "overview"));
    var next = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    select(next, true);
    e.preventDefault();
  });
  document.getElementById("panels").addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (go) { select(go.getAttribute("data-go")); window.scrollTo({ top: 0 }); }
    if (e.target.id === "copy") {
      var btn = e.target;
      var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy address"; }, 1800); };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("addr"));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        btn.textContent = "Selected, copy it";
      };
      try { navigator.clipboard.writeText(ADDRESS).then(done, fallback); } catch (err) { fallback(); }
    }
  });
  document.getElementById("panels").addEventListener("change", function (e) {
    var id = e.target.getAttribute("data-todo");
    if (!id) return;
    var done = {};
    try { done = JSON.parse(store("tw-todo") || "{}") || {}; } catch (err) { done = {}; }
    done[id] = e.target.checked;
    store("tw-todo", JSON.stringify(done));
  });

  var hash = (location.hash || "").slice(1);
  var initial = document.getElementById("p-" + hash) ? hash : (tripDay ? tripDay.id : (store("tw-tab") || "overview"));
  select(initial);
}
start();
</script>
